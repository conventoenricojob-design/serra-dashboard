  const k = keyGet();
  if (S.conn.kind !== 'ws' || !WsDrv.ready()) return;
  if (!k) { S.auth.state = 'none'; changed('auth'); return; }
  S.auth.state = 'sent'; S.auth.at = Date.now();
  WsDrv.write('AUTH ' + k);
  logLine('tx', 'AUTH ••••••');
  changed('auth');
}
const WsDrv = {
  ws: null, host: '', open: false, retry: 0, timer: null, want: false,
  ready() { return this.open; },
  write(line) { if (this.ws && this.open) this.ws.send(line); },
  connect(host) {
    this.want = true; this.host = host;
    try { localStorage.setItem('serra.wsHost', host); } catch (e) { /* ok */ }
    clearTimeout(this.timer);
    let ws;
    try { ws = new WebSocket('ws://' + host + '/ws'); } catch (e) { Hooks.toast('bad', 'Indirizzo WiFi non valido: ' + host); return; }
    this.ws = ws;
    ws.onopen = () => {
      if (ws !== this.ws) return;
      SimDrv.stop(true);
      this.open = true; this.retry = 0; Link.drv = this;
      onConnected('ws', host, { keep: false });
    };
    let buf = '';
    ws.onmessage = (e) => { buf += e.data; if (!buf.endsWith('\n')) buf += '\n'; const ls = buf.split('\n'); buf = ls.pop(); for (const l of ls) ingestLine(l); };
    ws.onclose = () => {
      if (ws !== this.ws) return;
      const was = this.open;
      this.open = false; this.ws = null;
      if (Link.drv === this) Link.drv = null;
      if (was) onDisconnected('WiFi interrotto');
      if (this.want) { this.retry = Math.min(this.retry + 1, 6); this.timer = setTimeout(() => this.connect(this.host), 1000 * 2 ** this.retry); }
    };
    ws.onerror = () => {};
  },
  disconnect() { this.want = false; clearTimeout(this.timer); if (S.fw.bench && (S.bench.active || S.bench.pending)) send('BENCH OFF', { quiet: true }); if (this.ws) this.ws.close(); }
};
$('#btnWifi').onclick = () => {
  if (S.conn.kind === 'ws') { WsDrv.disconnect(); return; }
  let last = 'serra.local';
  try { last = localStorage.getItem('serra.wsHost') || last; } catch (e) { /* ok */ }
  const h = prompt('Indirizzo della serra (serra.local sulla rete di casa, 192.168.4.1 collegandosi a «Serra-Fragole»):', last);
  if (!h) return;
  if (!keyGet()) { const k = prompt('Chiave di controllo (vuota = sola lettura):', ''); if (k) keySet(k.trim()); }
  WsDrv.connect(h.trim().replace(/^wss?:\/\//, '').replace(/\/.*$/, ''));
};

// ------------------------------------------------------------------------------ Cloud (MQTT su internet, sola lettura)
// La serra pubblica le sue righe (conservate) su serra/<codice>/<tipo> nel broker pubblico (PROTOCOLLO.md §8):
// questa pagina, anche su https, le legge via WebSocket sicuro da qualsiasi posto.
const CLOUD_URL = 'wss://broker.hivemq.com:8884/mqtt';
const cloudLink = (id) => 'https://conventoenricojob-design.github.io/serra-dashboard/?cloud=' + encodeURIComponent(id);
const mqttEnc = new TextEncoder();
const mqttStr = (x) => { const b = mqttEnc.encode(x); return [b.length >> 8, b.length & 255, ...b]; };
const mqttPkt = (type, body) => { const l = []; let n = body.length; do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; l.push(d); } while (n); return new Uint8Array([type, ...l, ...body]); };
// Comandi firmati: "<ms> <HMAC-SHA256(chiave, id|ms|comando) in hex> <comando>" su serra/<id>/cmd (PROTOCOLLO.md §8).
async function cloudSign(key, msg) {
  const k = await crypto.subtle.importKey('raw', mqttEnc.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return [...new Uint8Array(await crypto.subtle.sign('HMAC', k, mqttEnc.encode(msg)))].map((b) => b.toString(16).padStart(2, '0')).join('');
}
const CloudDrv = {
  ws: null, id: '', open: false, retry: 0, timer: null, ping: null, want: false, online: null, lastMs: 0,
  ready() { return this.open; },
  write(line) {
    const key = keyGet(), ws = this.ws, id = this.id;
    if (!key || !ws || !this.open) return;
    if (!(window.crypto && crypto.subtle)) { Hooks.toast('bad', 'Questo browser non può firmare i comandi: apri la pagina da https (GitHub) o da file.'); return; }
    const ms = this.lastMs = Math.max(Date.now(), this.lastMs + 1);
    cloudSign(key, id + '|' + ms + '|' + line).then((sig) => {
      if (ws.readyState === 1) ws.send(mqttPkt(0x30, [...mqttStr('serra/' + id + '/cmd'), ...mqttEnc.encode(ms + ' ' + sig + ' ' + line)]));
    });
  },
  connect(id) {
    this.want = true; this.id = id;
    try { localStorage.setItem('serra.cloudId', id); } catch (e) { /* ok */ }
    clearTimeout(this.timer);
    let ws;
    try { ws = new WebSocket(CLOUD_URL, 'mqtt'); } catch (e) { Hooks.toast('bad', 'Cloud non raggiungibile.'); return; }
    ws.binaryType = 'arraybuffer';
    this.ws = ws;
    const dec = new TextDecoder(), str = mqttStr, pkt = mqttPkt;
    ws.onopen = () => ws.send(pkt(0x10, [...str('MQTT'), 4, 0x02, 0, 60, ...str('dash-' + Math.random().toString(36).slice(2, 10))]));
    let buf = new Uint8Array(0);
    ws.onmessage = (e) => {
      const a = new Uint8Array(e.data), m = new Uint8Array(buf.length + a.length);
      m.set(buf); m.set(a, buf.length); buf = m;
      while (buf.length >= 2) {
        let len = 0, mul = 1, i = 1, d;
        do { if (i >= buf.length) return; d = buf[i++]; len += (d & 127) * mul; mul *= 128; } while ((d & 128) && i < 5);
        if (buf.length < i + len) return;
        const h = buf[0], body = buf.subarray(i, i + len);
        buf = buf.slice(i + len);
        if (h >> 4 === 2) {                                   // CONNACK
          if (body[1] !== 0) { Hooks.toast('bad', 'Il cloud ha rifiutato la connessione.'); this.want = false; ws.close(); return; }
          ws.send(pkt(0x82, [0, 1, ...str('serra/' + this.id + '/#'), 0]));
          clearInterval(this.ping); this.ping = setInterval(() => { try { ws.send(new Uint8Array([0xC0, 0])); } catch (er) { /* chiuso */ } }, 30000);
          SimDrv.stop(true);
          this.open = true; this.retry = 0; this.online = null; Link.drv = this;
          onConnected('cloud', this.id, { keep: false });
        } else if (h >> 4 === 3) {                            // PUBLISH
          const tl = (body[0] << 8) | body[1], topic = dec.decode(body.subarray(2, 2 + tl));
          const msg = dec.decode(body.subarray(2 + tl + (((h >> 1) & 3) ? 2 : 0)));
          if (topic.endsWith('/cmd')) continue;
          if (topic.endsWith('/ack')) {
            const m2 = /^(\d+) (OK|NO)\s*(.*)$/.exec(msg);
            if (m2) {
              logLine('rx', '[CLOUD] ' + (m2[2] === 'OK' ? 'comando accettato' : 'comando rifiutato: ' + m2[3]));
              if (m2[2] === 'NO') { Hooks.toast('bad', 'La serra ha rifiutato il comando: ' + m2[3], 8000); addEvent('CLOUD', 'Comando rifiutato: ' + m2[3], 'warn'); }
            }
            continue;
          }
          if (topic.endsWith('/online')) {
            const on = msg === '1';
            if (on !== this.online) { this.online = on; addEvent('CLOUD', on ? 'La serra è in linea' : 'La serra non è in linea: dati fermi all’ultimo invio', on ? 'info' : 'warn'); changed('conn'); }
            continue;
          }
          for (const l of msg.split('\n')) if (l.trim()) ingestLine(l);
        }
      }
    };
    ws.onclose = () => {
      if (ws !== this.ws) return;
      const was = this.open;
      clearInterval(this.ping); this.ping = null;
      this.open = false; this.ws = null;
      if (Link.drv === this) Link.drv = null;
      if (was) onDisconnected('Cloud interrotto');
      if (this.want) { this.retry = Math.min(this.retry + 1, 6); this.timer = setTimeout(() => this.connect(this.id), 1000 * 2 ** this.retry); }
    };
    ws.onerror = () => {};
  },
  disconnect() { this.want = false; clearTimeout(this.timer); if (this.ws) this.ws.close(); }
};
$('#btnCloud').onclick = () => {
  if (S.conn.kind === 'cloud') { CloudDrv.disconnect(); return; }
  let last = (S.net && S.net.cloud && S.net.cloud.id) || '';
  try { last = last || localStorage.getItem('serra.cloudId') || ''; } catch (e) { /* ok */ }
  const id = prompt('Codice cloud della serra (lo trovi in Rete, collegato via USB o WiFi):', last);
  if (!id) return;
  if (Link.ready()) { if (S.conn.kind === 'serial') SerialDrv.disconnect(); else if (S.conn.kind === 'ws') WsDrv.disconnect(); else SimDrv.stop(); }
  CloudDrv.connect(id.trim().toLowerCase());
};

// ------------------------------------------------------------------------------ comandi della barra
$('#btnConnect').onclick = () => { if (S.conn.state === 'connected' && S.conn.kind === 'serial') SerialDrv.disconnect(); else SerialDrv.connect(); };
$('#btnSim').onclick = () => { if (S.conn.kind === 'sim') SimDrv.stop(); else startSim({}); };
$('#btnStop').onclick = () => emergencyStop();
$('#btnTheme').onclick = () => { S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark'; saveSettings(); dirty('all'); };
const bd = $('#btnDevice');
if (bd) {
  bd.onclick = () => {
    const cur = currentDevice();
    const next = cur === 'mobile' ? 'desktop' : 'mobile';
    S.settings.device = next;
    saveSettings();
    applyDeviceMode();
    dirty('all');
    Hooks.toast('info', next === 'mobile' ? 'Vista Mobile (smartphone) attiva' : 'Vista Desktop (console completa) attiva', 2500);
  };
}
$('#modeRun').onclick = () => setMode('run');
$('#modeBench').onclick = () => setMode('bench');
$('#banners').addEventListener('click', (e) => { if (e.target.closest('[data-act=leave-bench]')) setMode('run'); });
window.addEventListener('hashchange', route);
window.addEventListener('beforeunload', () => { if (Link.ready() && S.fw.bench && (S.bench.active || S.bench.pending)) send('BENCH OFF', { quiet: true }); });

// ------------------------------------------------------------------------------ orologio della pagina
UI.lastSlow = 0;
setInterval(() => {
  const now = Date.now();
  updateDevice();
  if (UI.view && UI.view.tick) UI.view.tick();
  if (now - UI.lastSlow > 5000) { UI.lastSlow = now; dirty('slow'); }
  // lettura continua del banco: una READ alla volta, la successiva solo a misura conclusa
  if (S.mode === 'bench' && S.bench.live && Link.ready() && S.fw.v2 && S.route === 'sensori') {
    if (S.bench.readBusy && now - UI.lastLiveAt > 25000) S.bench.readBusy = false;
    if (!S.bench.readBusy && now - UI.lastLiveAt >= S.bench.liveMs) {
      UI.lastLiveAt = now; S.bench.readBusy = true;
      send('READ ' + SENSORS[S.sel].read + (S.sel === 'soil' ? ' 0' : ''), { quiet: true });
    }
  }
  if (S.calBusy && now - S.calBusy.t0 > 110000) { S.calBusy = null; dirty('cal'); Hooks.toast('warn', 'Nessuna risposta alla taratura: controlla la seriale.'); }
}, 1000);

// ------------------------------------------------------------------------------ avvio
function init() {
  S.settings = loadSettings();
  document.documentElement.dataset.theme = S.settings.theme;
  applyDeviceMode();
  window.addEventListener('resize', () => {
    if (!S.settings.device || S.settings.device === 'auto') applyDeviceMode();
  });
  route();
  // Stato di montaggio: se la pagina è servita via http (serve_live.py) lo legge da Reference/connections_state.json.
  if (/^https?:/.test(location.protocol)) {
    fetch('Reference/connections_state.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((j) => {
      const m = j && j.modules_active && j.modules_active.sensors;
      if (!m) return;
      const map = { soil_moisture_1: 'soil', tds: 'ec', ph: 'ph', dht11_air: 'air', water_temp_ds18b20: 'wt', float_switches: 'flt' };
      for (const k of Object.keys(map)) { const n = m[k]; if (!n) continue; const raw = String(n.test_status || n.status || '').split(/[\s(]/)[0]; if (WIRING_TEXT[raw]) S.wiring[map[k]] = raw; }
      dirty('all');
    }).catch(() => { /* resta il fallback incorporato */ });
  }
  // Parametri per prove e dimostrazioni: ?demo (simulazione v2.1) · ?demo=storico · ?bench
  const q = new URLSearchParams(location.search);
  if (q.has('demo')) startSim({ legacy: q.get('demo') === 'storico' });
  else if (q.get('cloud')) CloudDrv.connect(q.get('cloud').trim().toLowerCase());
  // Servita dall'ESP32 (http su un host di rete): collegamento WiFi automatico alla stessa serra.
  else if (location.protocol === 'http:' && !/^(localhost|127\.|\[::1\])/.test(location.hostname) && location.port !== '3333') WsDrv.connect(location.host);
  if (q.has('bench')) setMode('bench');

  // Rilevamento Telefono / Mobile: se aperto su smartphone senza ESP32 connesso, avvia subito la demo interattiva!
  if (isMobileEnv() && !Link.ready() && !q.has('demo') && !q.has('cloud')) {
    setTimeout(() => {
      if (!Link.ready() && S.conn.state === 'idle') {
        startSim({});
        Hooks.toast('ok', 'Rilevato smartphone: simulazione serra avviata in tempo reale.', 4000);
      }
    }, 400);
  }
}
window.serraDebug = { S, ingestLine, startSim, SimDrv, Sim, SENSORS, RELAYS, dirty, feed: (text) => text.split('\n').forEach((l) => ingestLine(l.replace(/^\[t= *[\d.]+\] ?/, ''))) };
init();
